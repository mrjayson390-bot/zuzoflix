<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report a problem</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="/assets/css/site.css?v=13"></head><body><main class="wrap page"><h1 class="ptitle">Report a problem or copyright complaint</h1>
<div class="page"><p>If you own a film shown here and did not allow it, or you see anything wrong on the site, tell us. We take complaints seriously and remove a film quickly while we check it.</p>
<form class="pform" id="pf" data-api="report">
<div class="hp"><label>Leave this empty</label><input name="website" tabindex="-1" autocomplete="off"></div>
<div><label>Link to the film page</label><input name="film_url" maxlength="300" placeholder="https://zuzoflix.click/watch/film-name"></div>
<div class="two"><div><label>Your name</label><input name="name" maxlength="120"></div><div><label>Phone, WhatsApp or email *</label><input name="contact" maxlength="190" required></div></div>
<div><label>What is the problem? *</label><textarea name="message" maxlength="3000" required placeholder="For a copyright complaint: say which film and that you are the owner or act for the owner."></textarea></div>
<button class="btn" type="submit">Send report</button><div id="fm"></div></form></div></main><script src="/assets/js/app.js?v=15"></script><script>
(async()=>{await Z.boot('');const f=document.getElementById('pf'),m=document.getElementById('fm'),t0=Date.now();
const u=new URLSearchParams(location.search).get('film');if(u&&f.film_url)f.film_url.value=u;
f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));d.confirm=f.confirm?f.confirm.checked:undefined;d.ts=t0;
const b=f.querySelector('button');b.disabled=true;m.className='';m.textContent='Sending...';
const r=await Z.api(f.dataset.api,{method:'POST',body:JSON.stringify(d)});b.disabled=false;
m.className='fmsg '+(r.ok?'ok':'err');m.textContent=r.message||(r.ok?'Sent.':'Could not send. Please try again.');if(r.ok)f.reset();};})();
</script></body></html>
